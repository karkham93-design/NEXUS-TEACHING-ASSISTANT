    <script>
      // Browser extension compatibility shim for window.fetch getter-only properties
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property is non-configurable
        }
      })();
    </script>
