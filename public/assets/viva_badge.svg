<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <!-- Rich Crimson Maroon Gradient for Shield -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#800a1b"/>
      <stop offset="50%" stop-color="#660514"/>
      <stop offset="100%" stop-color="#4d020c"/>
    </linearGradient>

    <!-- Torch Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Path for the curved banner text -->
    <path id="textArc" d="M 65 375 Q 200 450 335 375" fill="none"/>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- BACK RIBBON TAILS (Left & Right) -->
    <!-- Left Ribbon Fold -->
    <path d="M 50 185 L 5 185 L 25 215 L 5 245 L 50 245 Z" fill="#18181b" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right Ribbon Fold -->
    <path d="M 350 185 L 395 185 L 375 215 L 395 245 L 350 245 Z" fill="#18181b" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- MAIN SHIELD BASE -->
    <!-- Outer Shield Border (Black + Gold) -->
    <path d="M 200 15 L 340 70 L 340 240 Q 340 375 200 420 Q 60 375 60 240 L 60 70 Z" 
          fill="#ffffff" stroke="#18181b" stroke-width="8" stroke-linejoin="round"/>
    
    <path d="M 200 24 L 332 75 L 332 238 Q 332 368 200 410 Q 68 368 68 238 L 68 75 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- INNER MAROON SHIELD (Upper and Lower) -->
    <path d="M 200 32 L 324 80 L 324 235 Q 324 360 200 400 Q 76 360 76 235 L 76 80 Z" 
          fill="url(#maroonGrad)" stroke="#18181b" stroke-width="3"/>

    <!-- UPPER SECTION: TORCH FLAME -->
    <!-- Torch Bowl Rungs -->
    <path d="M 165 170 L 235 170 L 230 185 L 170 185 Z" fill="#ffffff" stroke="#18181b" stroke-width="3"/>
    <path d="M 170 185 L 230 185 L 225 195 L 175 195 Z" fill="#d97706" stroke="#18181b" stroke-width="2"/>
    <path d="M 173 160 L 227 160 L 232 170 L 168 170 Z" fill="#f8fafc" stroke="#18181b" stroke-width="2.5"/>

    <!-- Dynamic Flame -->
    <path d="M 200 10 Q 230 50 215 90 Q 245 80 240 120 Q 235 155 200 160 Q 165 155 160 120 Q 155 80 185 90 Q 170 50 200 10 Z" 
          fill="url(#flameGrad)" stroke="#7c2d12" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Inner Flame Tongue -->
    <path d="M 200 40 Q 218 70 208 100 Q 225 105 218 135 Q 200 152 185 135 Q 178 105 195 100 Q 185 70 200 40 Z" 
          fill="#fef08a" opacity="0.9"/>

    <!-- MIDDLE BANNER: VIVA COLLEGE SCHOOL -->
    <!-- Banner Shadow & Base -->
    <rect x="42" y="195" width="316" height="66" rx="4" fill="#18181b" stroke="#000000" stroke-width="4"/>
    <rect x="46" y="199" width="308" height="58" rx="2" fill="#18181b" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- "VIVA" in white bold serif -->
    <text x="200" y="235" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-weight="900" 
          font-size="38" 
          fill="#ffffff" 
          letter-spacing="5" 
          text-anchor="middle"
          stroke="#000000"
          stroke-width="1.5">VIVA</text>

    <!-- "COLLEGE SCHOOL" in golden sans-serif -->
    <text x="200" y="253" 
          font-family="'Arial Black', Impact, sans-serif" 
          font-weight="800" 
          font-size="12.5" 
          fill="#fbbf24" 
          letter-spacing="3.5" 
          text-anchor="middle">COLLEGE SCHOOL</text>

    <!-- LOWER SHIELD: CLENCHED FIST EMBLEM -->
    <!-- Medallion Background -->
    <path d="M 200 280 Q 225 280 230 300 Q 230 330 200 345 Q 170 330 170 300 Q 175 280 200 280 Z" 
          fill="#5c0612" stroke="#fbbf24" stroke-width="3"/>
    
    <!-- Stylized Fist Icon -->
    <g transform="translate(182, 287) scale(0.9)">
      <!-- Fingers & Thumb -->
      <rect x="6" y="8" width="28" height="20" rx="6" fill="#fde68a" stroke="#450a0a" stroke-width="2.5"/>
      <path d="M 13 8 L 13 22 M 20 8 L 20 22 M 27 8 L 27 22" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
      <!-- Thumb Fold -->
      <path d="M 4 18 Q 8 26 22 26 Q 30 26 34 20" fill="none" stroke="#450a0a" stroke-width="3" stroke-linecap="round"/>
      <!-- Palm Base -->
      <path d="M 8 28 L 32 28 L 28 38 L 12 38 Z" fill="#f59e0b" stroke="#450a0a" stroke-width="2.5"/>
      <!-- Wristband / Cuff -->
      <rect x="7" y="38" width="26" height="7" rx="2" fill="#ffffff" stroke="#450a0a" stroke-width="2"/>
    </g>

    <!-- BOTTOM MOTTO BANNER: "GREAT MINDS SHAPE THE WORLD" -->
    <!-- Banner Ribbon Contour -->
    <path d="M 52 355 Q 200 455 348 355 L 358 385 Q 200 485 42 385 Z" 
          fill="#ffffff" stroke="#18181b" stroke-width="4.5" stroke-linejoin="round"/>
    
    <path d="M 56 360 Q 200 450 344 360 L 352 380 Q 200 475 48 380 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Motto Text along arc -->
    <text font-family="Georgia, 'Times New Roman', serif" 
          font-weight="900" 
          font-size="12" 
          fill="#18181b" 
          letter-spacing="2">
      <textPath href="#textArc" startOffset="50%" text-anchor="middle">
        GREAT MINDS SHAPE THE WORLD
      </textPath>
    </text>
  </g>
</svg>
